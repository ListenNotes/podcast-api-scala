plugins {
    id 'scala'
    id 'application'
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.scala-lang:scala-library:2.13.17'
    implementation "${GROUP_ID}:${POM_ARTIFACT_ID}:${VERSION_NAME}"
    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
dependencyLocking {
    lockAllConfigurations()
    // The exact SDK version is pinned in gradle.properties. Excluding this one
    // module lets the same locks work with Maven and a --include-build checkout.
    ignoredDependencies.add('com.listennotes:podcast-api')
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ['-release:17', '-deprecation', '-feature', '-unchecked', '-Werror']
}
application { mainClass = 'podcast.api.scala.demo.App' }

def readmeSources = layout.buildDirectory.dir('generated/readme')
tasks.register('compileReadmeSources') {
    inputs.file(rootProject.file('README.md'))
    outputs.dir(readmeSources)
    doLast {
        def output = readmeSources.get().asFile
        delete(output)
        output.mkdirs()
        def snippets = (rootProject.file('README.md').text =~ /(?ms)^```scala\n(.*?)^```/)
        if (snippets.size() != 31) throw new GradleException('Expected usage plus 30 generated README examples')
        snippets.eachWithIndex { match, index ->
            new File(output, "Example${index}.scala").text = "package readme.example${index}\n\n" + match[1]
        }
    }
}
sourceSets.test.scala.srcDir(readmeSources)
tasks.named('compileTestScala') { dependsOn 'compileReadmeSources' }
tasks.named('test') { useJUnitPlatform { excludeTags 'integration' } }
tasks.register('integrationTest', Test) {
    description = 'Opt-in requests to the credential-free public mock only.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter test
}
